name: رابط ما يشتغل
description: بلّغ عن رابط في القائمة ما يفتح أو صار يودّي لمكان غلط
title: "[رابط خربان] "
labels: ["broken-link"]
body:
  - type: input
    id: game
    attributes:
      label: اسم اللعبة
    validations:
      required: true
  - type: input
    id: translation
    attributes:
      label: اسم التعريب
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: الرابط اللي ما يشتغل
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: وش المشكلة
      options:
        - الصفحة ما تفتح (خطأ 404 أو غيره)
        - يفتح بس التعريب انحذف
        - صار يودّي لموقع ثاني
        - التحميل خربان
        - شي ثاني
    validations:
      required: true
  - type: input
    id: newurl
    attributes:
      label: الرابط الصحيح الجديد (لو تعرفه)
      placeholder: https://
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: ملاحظات
    validations:
      required: false
